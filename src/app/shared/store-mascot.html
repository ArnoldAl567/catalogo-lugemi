@if (visible()) {
  <div class="mascot-shell" [class.ready]="ready()" [class.blocked]="blocked()">
    @if (open()) {
      <section class="mascot-bubble" aria-label="Saludo de Otto">
        <button class="close-bubble" type="button" aria-label="Cerrar saludo" (click)="close()">×</button>
        <span class="mascot-eyebrow">Tu compañero de aventuras</span>
        <h2>¡Hola, soy Otto! <span aria-hidden="true">✦</span></h2>
        <p>¿Te ayudo a elegir? El botón verde de abajo te lleva al WhatsApp de la tienda.</p>
        <a routerLink="/catalogo" (click)="close()" class="mascot-explore">Explorar la colección <span aria-hidden="true">↗</span></a>
        <div class="mascot-controls">
          <button type="button" (click)="hide()">Ocultar a Otto</button>
        </div>
      </section>
    }
    <button class="mascot-character" type="button" aria-label="Saludar a Otto" [attr.aria-expanded]="open()" title="¡Hola! Tócame para saludar" (click)="greet()">
      <img class="mascot-pointing" src="/images/brand/lugemi-mascota-senala.png" alt="Otto de pie señalando hacia WhatsApp" width="1280" height="1280" draggable="false">
    </button>
    @if (!open()) {
      <span class="whatsapp-cue" aria-hidden="true">¿Te ayudamos? <span>↓</span></span>
    }
  </div>
} @else {
  <button type="button" class="mascot-restore" [class.blocked]="blocked()" (click)="show()">Mostrar a Otto</button>
}
